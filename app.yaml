apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: matrix-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters: {}
              # selector:
              #   matchLabels:
              #     env: dev
          - git:
              repoURL: https://github.com/libialany/argocd-apps.git
              revision: HEAD
              directories:
                - path: apps/*
  template:
    metadata:
      name: '{{.path.basename}}-{{.name}}'
      labels:
        managed-by: applicationset
        generator: matrix
        app: '{{.path.basename}}'
        cluster: '{{.name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/libialany/argocd-apps.git
        targetRevision: HEAD
        path: '{{.path.path}}'
        helm:
          releaseName: '{{.path.basenameNormalized}}'
      destination:
        server: '{{.server}}'
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true