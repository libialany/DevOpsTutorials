apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - appName: nginx
            namespace: nginx
            cluster: https://kubernetes.default.svc
            repoURL: https://charts.bitnami.com/bitnami
            chart: nginx
            chartVersion: 18.2.4
            
  template:
    metadata:
      name: '{{.appName}}'
      labels:
        managed-by: applicationset
        generator: list
    spec:
      project: default
      source:
        repoURL: '{{.repoURL}}'
        chart: '{{.chart}}'
        targetRevision: '{{.chartVersion}}'
        helm:
          releaseName: '{{.appName}}'
          valuesObject:
            service:
              type: ClusterIP
            image:
              repository: bitnamilegacy/nginx
      destination:
        server: '{{.cluster}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true